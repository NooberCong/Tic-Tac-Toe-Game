<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="description" content="Free portable 2P tic tac toe game">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="theme-color" content="#12161e">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon"
        href="https://cdn3.iconfinder.com/data/icons/essenstial-ultimate-ui/64/tic_tac_toe-512.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.11.2/css/all.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Inter:wght@400;600;700&display=swap"
        rel="stylesheet">
    <title>Tic Tac Toe</title>
    <style>
        :root {
            --bg:         #12161e;
            --board-gap:  #1e2738;
            --cell-bg:    #1a2030;
            --cell-hover: #202840;
            --color-x:    #43dde6;
            --color-o:    #fc5185;
            --color-gold: #fdcb6e;
            --panel-bg:   #1e2738;
            --text:       #e2e8f5;
            --text-muted: #7a8fa8;
            --radius-lg:  14px;
            --radius-md:  10px;
            --radius-sm:  6px;
            --ease:       0.15s ease;
        }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html::-webkit-scrollbar { display: none; }

        body {
            font-family: 'Inter', sans-serif;
        }

        .App {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 2.5rem;
            background: linear-gradient(145deg, #12161e 0%, #0c1018 100%);
        }

        /* ── Game Board ── */
        .table {
            width: min(78vh, 78vw);
            height: min(78vh, 78vw);
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 0.45rem;
            padding: 0.45rem;
            background-color: var(--board-gap);
            border-radius: var(--radius-lg);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.55);
        }

        .square {
            background-color: var(--cell-bg);
            cursor: pointer;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 5rem;
            font-family: 'Luckiest Guy', cursive;
            transition: background-color var(--ease);
            user-select: none;
        }

        .square:hover:not(:has(p)) {
            background-color: var(--cell-hover);
        }

        /* ── Right Panel ── */
        .right {
            width: 260px;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        /* ── Brand ── */
        .brand {
            text-align: center;
        }

        .brand span {
            font-size: 3rem;
            font-family: 'Luckiest Guy', cursive;
            letter-spacing: 0.03em;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.4);
        }

        .brand span:nth-child(1) { color: var(--color-o); }
        .brand span:nth-child(2) { color: var(--color-x); }
        .brand span:nth-child(3) { color: var(--color-gold); }

        /* ── Score Panel ── */
        .result-board {
            background-color: var(--panel-bg);
            border-radius: var(--radius-lg);
            padding: 1.4rem 1.6rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
            display: flex;
            flex-direction: column;
            gap: 0.9rem;
        }

        .score-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .score-label {
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .score-label.x { color: var(--color-x); }
        .score-label.o { color: var(--color-o); }

        .result-board .score {
            font-size: 1.9rem;
            font-weight: 700;
            color: var(--text);
            min-width: 2ch;
            text-align: right;
        }

        .divider {
            height: 1px;
            border: none;
            background: rgba(255, 255, 255, 0.07);
        }

        /* ── Options ── */
        .result-board .options {
            display: flex;
            flex-direction: column;
            gap: 0.65rem;
            padding-top: 0.25rem;
        }

        .play-again-btn {
            width: 100%;
            padding: 0.55rem 1rem;
            background: rgba(253, 203, 110, 0.08);
            border: 1px solid var(--color-gold);
            border-radius: var(--radius-sm);
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 0.06em;
            color: var(--color-gold);
            cursor: pointer;
            outline: none;
            transition: background-color var(--ease), transform var(--ease);
        }

        .play-again-btn:hover {
            background: rgba(253, 203, 110, 0.18);
        }

        .play-again-btn:active {
            transform: scale(0.97);
        }

        .result-board .mode {
            cursor: pointer;
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.45rem;
            transition: color var(--ease);
            user-select: none;
        }

        .result-board .mode:hover {
            color: var(--text);
        }

        .result-board .mode i {
            font-size: 1rem;
        }

        /* ── Animations ── */
        @keyframes scaleUp {
            from { transform: scale(0.1); opacity: 0; }
            to   { transform: scale(1);   opacity: 1; }
        }

        @keyframes fade {
            0%   { opacity: 1; }
            25%  { opacity: 0.15; }
            50%  { opacity: 1; }
            75%  { opacity: 0.15; }
            100% { opacity: 1; }
        }

        /* ── Responsive ── */
        @media (max-width: 720px) {
            .App {
                height: auto;
                min-height: 100vh;
                flex-direction: column-reverse;
                padding: 1.5rem 0;
                gap: 1.25rem;
            }

            .table {
                width: min(92vw, 92vh);
                height: min(92vw, 92vh);
            }

            .right {
                width: min(92vw, 360px);
            }

            .brand span { font-size: 2.4rem; }
        }
    </style>
</head>

<body>
    <div class="App">
        <div class="table">
            <div class="square" id="00"></div>
            <div class="square" id="01"></div>
            <div class="square" id="02"></div>
            <div class="square" id="10"></div>
            <div class="square" id="11"></div>
            <div class="square" id="12"></div>
            <div class="square" id="20"></div>
            <div class="square" id="21"></div>
            <div class="square" id="22"></div>
        </div>
        <div class="right">
            <div class="brand">
                <span>Tic </span><span>Tac </span><span>Toe</span>
            </div>
            <div class="result-board">
                <div class="score-row">
                    <p class="score-label x">Player X</p>
                    <span class="score" id="X-score">0</span>
                </div>
                <hr class="divider">
                <div class="score-row">
                    <p class="score-label o">Player O</p>
                    <span class="score" id="O-score">0</span>
                </div>
                <hr class="divider">
                <div class="options">
                    <button class="play-again-btn">Play Again</button>
                    <p class="mode">Switch Mode: <i class="fas fa-user-ninja"></i>2P</p>
                </div>
            </div>
        </div>
    </div>
    <script>
        window.addEventListener("load", () => {
            let turn = 0;
            let board = new Array(3);
            let players = [{ name: "X", score: 0 }, { name: "O", score: 0 }];
            let finished = false;
            const playAgainBtn = document.querySelector(".play-again-btn");
            //Generate an empty 3 x 3 array/board
            const resetBoard = (board) => {
                for (let i = 0; i < 3; i++) {
                    board[i] = ['', '', ''];
                }
            }
            resetBoard(board);

            const bestMove = (board, turn) => {
                let bestScore = -Infinity;
                let move;
                for (let x = 0; x < 3; x++) {
                    for (let y = 0; y < 3; y++) {
                        if (board[x][y] === '') {
                            board[x][y] = "O";
                            let score = minimax(board, 0, false, turn);
                            board[x][y] = '';
                            if (score > bestScore) {
                                bestScore = score;
                                move = { x: x, y: y };
                            }
                        }
                    }
                }
                let squareToPick = document.getElementById(`${move.x}${move.y}`);
                squareToPick.click();
            }


            const minimax = (board, depth, isMaximizing) => {
                if (
                    board.every(row => !row.includes(''))
                ) {
                    return 0;
                }
                let hasWinner = someOneWins(board);
                if (hasWinner.result) {
                    return hasWinner.player === "O" ? 10 - depth : -10 + depth;
                }

                if (isMaximizing) {
                    let bestScore = -Infinity;
                    for (let x = 0; x < 3; x++) {
                        for (let y = 0; y < 3; y++) {
                            if (board[x][y] == '') {
                                board[x][y] = "O";
                                let score = minimax(board, depth + 1, false);
                                board[x][y] = '';
                                bestScore = Math.max(score, bestScore);
                            }
                        }
                    }
                    return bestScore;
                }
                else {
                    let bestScore = Infinity;
                    for (let x = 0; x < 3; x++) {
                        for (let y = 0; y < 3; y++) {
                            if (board[x][y] == '') {
                                board[x][y] = "X";
                                let score = minimax(board, depth + 1, true);
                                board[x][y] = '';
                                bestScore = Math.min(score, bestScore);
                            }
                        }
                    }
                    return bestScore;
                }
            }


            //check if there is a winner
            const check = (startX, startY, board, dx, dy) => {
                const start = board[startX][startY];
                if (board[startX][startY] === '') {
                    return false;
                }
                for (let i = 0; i < 3; i++) {
                    if (board[startX + i * dx][startY + i * dy] !== start) {
                        return false;
                    }
                }
                return true;
            }
            const someOneWins = (board, turn, currPlayer) => {
                //check rows and columns
                for (let i = 0; i < 3; i++) {
                    if (check(0, i, board, 1, 0)) return { result: true, coords: [`0${i}`, `1${i}`, `2${i}`], player: board[0][i] };
                    if (check(i, 0, board, 0, 1)) return { result: true, coords: [`${i}0`, `${i}1`, `${i}2`], player: board[i][0] };
                }

                //check diagonals
                if (check(0, 0, board, 1, 1)) return { result: true, coords: ['00', '11', '22'], player: board[0][0] };
                if (check(0, 2, board, 1, -1)) return { result: true, coords: ['02', '11', '20'], player: board[0][2] };
                return turn === 8 ? { result: "draw" } : { result: false };
            }

            const squares = document.querySelectorAll(".square");

            //make squares clickable
            squares.forEach(sqrt => {
                sqrt.addEventListener("click", () => {
                    const x = sqrt.getAttribute("id")[0];
                    const y = sqrt.getAttribute("id")[1];
                    //If a square is clicked, stop the player from interacting
                    if (!board[x][y] && !finished) {
                        let player = players[turn % 2];
                        sqrt.innerHTML = `<p>${player.name}</p>`;
                        sqrt.style.color = player.name === "X" ? "#43dde6" : "#fc5185";
                        const text = sqrt.firstChild;
                        text.style.animation = "0.2s ease scaleUp";
                        text.addEventListener('animationend', () => text.style.animation = "");
                        board[x][y] = player.name;


                        //Check every move if there is a winner
                        const gameState = someOneWins(board, turn);
                        if (gameState.result) {
                            //Get the squares that made up the winning line
                            if (gameState.result !== "draw") {
                                gameState.coords.forEach(coord => {
                                    const node = document.getElementById(coord).firstChild;
                                    node.style.animation = "0.5s ease fade";
                                    node.addEventListener('animationend', () => node.style.animation = '');
                                });
                                player.score += 1;
                                document.querySelector(`#${player.name}-score`).innerHTML = player.score;
                            }
                            finished = true;
                        }

                        //if there is no winner, increment turn by 1
                        turn++;
                        if (player.name === players[0].name && !finished && AI_mode) {
                            bestMove(board);
                        }
                    }
                });
            })


            //Add Replay functionality
            playAgainBtn.addEventListener('click', () => {
                squares.forEach(sqrt => sqrt.innerHTML = "");
                resetBoard(board);
                if (finished) {
                    finished = false;
                    //Change the starting player
                    players.reverse();
                }
                turn = 0;
            });

            //Enable changing mode between vs P and vs AI
            let AI_mode = false;
            const changeMode = document.querySelector(".mode");
            changeMode.addEventListener("click", () => {
                AI_mode = !AI_mode;
                changeMode.innerHTML = AI_mode ? "Switch Mode: <i class='fas fa-robot'></i>1P" : "Switch Mode: <i class='fas fa-user-ninja'></i>2P";
                playAgainBtn.click();
            })

        })
    </script>
    <script>
        //Register serviceWorker to cache and allow this app to work offline
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('service-worker.js');
            })
        }
    </script>
</body>

</html>
